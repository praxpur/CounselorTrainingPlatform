# 放入 /etc/nginx/conf.d/。这些指令位于 http 上下文。
# 发布前将所有 training.example.edu.cn 替换为学校申请的真实域名。
log_format counselor '$time_iso8601 ip=$remote_addr request=$request_id '
                     'status=$status bytes=$body_bytes_sent "$request_method $uri" '
                     'request_time=$request_time upstream_time=$upstream_response_time';
limit_req_zone $binary_remote_addr zone=counselor_api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=counselor_login:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=counselor_connections:10m;

upstream counselor_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name training.example.edu.cn;
    return 308 https://training.example.edu.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name training.example.edu.cn;
    ssl_certificate /etc/letsencrypt/live/training.example.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training.example.edu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:counselor_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/counselor-access.log counselor;
    error_log /var/log/nginx/counselor-error.log warn;
    client_max_body_size 16k;
    client_body_timeout 15s;
    send_timeout 65s;
    limit_conn counselor_connections 2000;
    limit_conn_status 429;
    limit_req_status 429;

    location = /api/auth/dev {
        return 404;
    }
    location = /api/auth/login {
        limit_req zone=counselor_login burst=500 nodelay;
        include /etc/nginx/snippets/counselor-proxy.conf;
    }
    location = /api/proofs {
        client_max_body_size 5m;
        limit_req zone=counselor_api burst=2000 nodelay;
        include /etc/nginx/snippets/counselor-proxy.conf;
    }
    location /api/ {
        limit_req zone=counselor_api burst=2000 nodelay;
        include /etc/nginx/snippets/counselor-proxy.conf;
    }
    location = /health {
        limit_req zone=counselor_api burst=2000 nodelay;
        include /etc/nginx/snippets/counselor-proxy.conf;
    }
    # 材料、数据库、代码不以任何静态目录公开；下载全部经应用鉴权。
    location / {
        return 404;
    }
}
